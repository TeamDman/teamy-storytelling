<html><body><script type="module">
import project from '/project.ts?project';import {Renderer,Vector2} from '@motion-canvas/core';
const profile=new URLSearchParams(location.search).get('profile')??'first';
window.logs=[];project.logger.onLogged.subscribe(x=>window.logs.push(x));const r=new Renderer(project);r.onFinished.subscribe(x=>window.result=x);r.onFrameChanged.subscribe(f=>window.frame=f);
window.run=async()=>{await r.render({...project.meta.getFullRenderingSettings(),name:profile==='first'?'move1stack-orbit':'move1stack-source-cutout-orbit',size:new Vector2(1280,720),resolutionScale:1,fps:30,range:[0,24],exporter:{name:'@motion-canvas/ffmpeg',options:{fastStart:true,includeAudio:false}}});window.done=true};window.ready=true;
</script></body></html>
