<!doctype html>
<html><head><meta charset="utf-8"><title>Moon Snail film renderer</title>
<style>*{margin:0}body{background:#1d1730}canvas{display:block;width:1280px;height:720px}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas><script>
const canvas=document.querySelector('#c'),x=canvas.getContext('2d');
const C={ink:'#302247',paper:'#f4edda',purple:'#6b4c94',lav:'#ddd0ee',mint:'#a8c6af',pink:'#edaaa4',gold:'#f2cf80',white:'#fffdf6'};
let data=[],imgs={};
function box(a,b,w,h,fill,stroke=C.ink,r=16,lw=3){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();if(stroke){x.lineWidth=lw;x.strokeStyle=stroke;x.stroke()}}
function text(s,a,b,size=32,color=C.ink,weight='normal',font='Noto Serif'){x.fillStyle=color;x.font=`${weight} ${size}px ${font}`;x.textBaseline='top';x.fillText(s,a,b)}
function lines(arr,a,b,size=32,color=C.ink,step=1.3,font='Noto Serif',weight='normal'){arr.forEach((v,i)=>text(v,a,b+i*size*step,size,color,weight,font))}
function line(a,b,c,d,color=C.ink,width=4){x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.strokeStyle=color;x.lineWidth=width;x.stroke()}
function arrow(a,b,c,d,color=C.purple){line(a,b,c,d,color,5);const angle=Math.atan2(d-b,c-a);line(c,d,c-15*Math.cos(angle-.55),d-15*Math.sin(angle-.55),color,5);line(c,d,c-15*Math.cos(angle+.55),d-15*Math.sin(angle+.55),color,5)}
function image(name,a,b,w,h){const im=imgs[name];if(!im)return;x.save();x.beginPath();x.roundRect(a,b,w,h,8);x.clip();const k=Math.min(w/im.naturalWidth,h/im.naturalHeight),iw=im.naturalWidth*k,ih=im.naturalHeight*k;x.drawImage(im,a+(w-iw)/2,b+(h-ih)/2,iw,ih);x.restore()}
function browser(name,a,b,w,h,label){box(a+5,b+6,w,h,C.lav,null,13);box(a,b,w,h,C.white,C.ink,13);box(a,b,w,28,C.ink,null,12);for(let i=0;i<3;i++){x.beginPath();x.fillStyle=[C.pink,C.gold,C.mint][i];x.arc(a+14+i*15,b+14,4,0,7);x.fill()}image(name,a+4,b+31,w-8,h-35);if(label)text(label,a,b+h+7,21,C.purple,'bold','DejaVu Sans')}
function heading(kicker,title){text(kicker.toUpperCase(),55,25,25,C.purple,'bold','DejaVu Sans');text(title,55,61,39,C.ink,'bold')}
function bg(){x.fillStyle=C.paper;x.fillRect(0,0,1280,720);for(let i=0;i<12;i++){x.fillStyle=i%2?C.lav:'#e9ddc4';x.beginPath();x.arc((i*397+110)%1280,(i*139+40)%550,2,0,7);x.fill()}}
function codePanel(kicker,arr,highlight=-1){text(kicker.toUpperCase(),65,25,28,C.purple,'bold','DejaVu Sans');box(55,82,1170,448,'#29233d',null,18);arr.forEach((s,i)=>{if(i===highlight)box(68,94+i*57,1144,53,'#57466c',null,5);text(s,85,96+i*57,46,'#fff6dc','normal','DejaVu Sans Mono')})}
function caption(s){box(55,562,1170,146,'#211a30',null,14);x.font='normal 42px DejaVu Sans';const rows=[''];for(const word of s.split(' ')){const i=rows.length-1,candidate=rows[i]+(rows[i]?' ':'')+word;if(x.measureText(candidate).width>1105&&rows.length<2)rows.push(word);else rows[i]=candidate;}lines(rows,85,576,42,'#fffdf6',1.26,'DejaVu Sans')}
function crop(name,sx,sy,sw,sh,dx,dy,dw,dh){x.drawImage(imgs[name],sx,sy,sw,sh,dx,dy,dw,dh)}
function cardDiagram(t,reveal){const progress=reveal?Math.min(1,Math.max(0,(t-.2)/3.4)):0;const down=Math.min(1,progress*2),across=Math.max(0,progress*2-1);const left=215,top=120,width=850-370*across;box(left,top,width,380,C.lav);text('.postcard = parent',245,145,33,C.ink,'bold','DejaVu Sans');box(255,220,280,105,C.gold);text('snail image',292,251,31,C.ink,'bold','DejaVu Sans');box(725-470*across,220+135*down,280,105,C.pink);text('note',822-470*across,251+135*down,31,C.ink,'bold','DejaVu Sans');text('SCHEMATIC',250,472,23,C.purple,'bold','DejaVu Sans')}
function draw(scene,t,sub,item){bg();
 if(scene==='hook'){
  heading('Neocities from scratch','Can code put the pictures there?');browser('wide',70,125,700,390,'ACTUAL BROWSER · HANDMADE PAGE');
  box(825,170,365,260,C.lav);lines(['A picture beside','a note.','A stamp on','a postcard.'],860,204,34,C.ink,1.5,'DejaVu Sans','bold');
 } else if(scene==='hook2'){
  heading('One handmade page','The same files, two screens');browser('wide',70,125,620,395,'WIDE · ACTUAL BROWSER');browser('phone',915,105,190,412,'PHONE');box(921,273,178,224,C.lav,C.ink,8);text('?',982,310,80,C.purple,'bold','DejaVu Sans');text('PREDICT',942,421,25,C.ink,'bold','DejaVu Sans');arrow(720,315,870,315);
 } else if(scene==='page_predict'){
  heading('Pause and predict','What happens when space gets narrow?');browser('wide',100,125,650,390,'ACTUAL BROWSER · 1024px');text('Picture + note',805,220,36,C.purple,'bold','DejaVu Sans');text('What changes?',805,285,36,C.ink,'bold','DejaVu Sans');
 } else if(scene==='page_reveal'){
  heading('The real page','One set of rules, changing space');const seq=[['wide',1024,760],['w900',900,760],['w800',800,760],['middle',700,760],['w650',650,760],['w600',600,760],['w500',500,760],['phone',390,844]];const beat=item.cues.find(c=>c.text.startsWith('Now the note'));const reveal=beat?beat.start-item.start:1.8;const k=Math.min(7,Math.floor(Math.max(0,t)/Math.max(.2,reveal)*8));const [name,vw,vh]=seq[k],scale=.48;browser(name,100,110,vw*scale,vh*scale+30,'');lines(['Same HTML + CSS','Picture and note','find room to fit.'],765,185,34,C.ink,1.8,'DejaVu Sans');text(`ACTUAL CAPTURE · ${vw}px`,765,460,23,C.purple,'bold','DejaVu Sans');
 } else if(scene==='formats'){
  heading('PNG, SVG and HTML','A fixed picture is not page reflow');browser('wide',55,150,390,285,'PNG · FROZEN');box(478,150,320,285,C.lav);box(565,222,145,96,C.gold);text('SVG',596,247,35,C.ink,'bold','DejaVu Sans');text('FIXED VECTOR',500,455,26,C.purple,'bold','DejaVu Sans');browser('phone',945,125,165,357,'HTML · REFLOWS');
 } else if(scene==='files'){
  codePanel('Schematic · index.html excerpt',['<!doctype html>','<html lang="en">','<link rel="stylesheet"','  href="style.css">','<h1>Moon Snail<br>Post Office</h1>','<p>Slow mail for faraway friends.</p>','<!-- more content follows -->'],t<3?0:2);
 } else if(scene==='html'){
  const beat=item.cues.find(c=>c.text.includes('decorative stamp'));codePanel('HTML excerpt · some text omitted',['<section class="postcard">','  <img src="snail.svg" alt="...">','  <div class="postcard-note">...</div>','  <img class="stamp"','       src="stamp.svg" alt="">','</section>'],beat&&t>=beat.start-item.start?4:1);
 } else if(scene==='local'){
  heading('Schematic · files to view','The browser reads, then lays out');box(55,190,300,220,C.white);lines(['index.html','style.css','images'],85,224,34,C.ink,1.6,'DejaVu Sans Mono');arrow(380,300,465,300);box(490,190,290,220,C.lav);lines(['BROWSER','reads → lays out','→ draws'],525,227,31,C.ink,1.6,'DejaVu Sans','bold');arrow(805,300,880,300);let dot=380+Math.min(1,(t%5)/4)*500;x.fillStyle=C.purple;x.beginPath();x.arc(dot,300,10,0,7);x.fill();browser('phone',935,110,165,357,'LOCAL BROWSER');
 } else if(scene==='flow'){
  heading('Normal flow','Boxes follow one another');box(90,135,560,365,C.white);[['Heading',C.gold],['Picture',C.lav],['Note',C.pink],['Next section',C.mint]].forEach(([s,col],i)=>{box(125,155+i*80,490,62,col);text(s,150,172+i*80,30,C.ink,'bold','DejaVu Sans')});arrow(705,290,790,290);lines(['Content has an order.','Each box affects','what comes next.'],830,200,33);
 } else if(scene==='rules'){
  heading('Schematic · relationships','Keep the snail beside its note');box(55,145,500,340,C.white);text('A coordinate',85,175,34,C.ink,'bold');box(135,250,200,120,C.gold);image('snail',145,260,180,100);text('x = 180, y = 290',85,425,28,C.purple,'bold','DejaVu Sans Mono');box(690,145,535,340,C.lav);text('A layout rule',720,175,34,C.ink,'bold');box(725,250,190,120,C.gold);image('snail',735,260,170,100);box(990,250,180,120,C.pink);text('note',1034,290,32,C.ink,'bold','DejaVu Sans');arrow(925,310,980,310);text('share room · keep a gap',720,425,27,C.purple,'bold','DejaVu Sans');
 } else if(scene==='grid_code'){
  const beat=item.cues.find(c=>c.text.includes('This columns rule'));codePanel('CSS excerpt · the postcard rule',['.postcard {','  display: grid;','  grid-template-columns:','    repeat(auto-fit,','      minmax(min(100%, 260px), 1fr));','  gap: 24px;','}'],beat&&t>=beat.start-item.start?4:1);
 } else if(scene==='grid_predict'||scene==='grid_reveal'){
  heading('Schematic · CSS Grid',scene==='grid_predict'?'Predict: where will the note go?':'One rule, different available space');cardDiagram(t,scene==='grid_reveal');
 } else if(scene==='stamp_code'){
  const beat=item.cues.find(c=>c.text.startsWith('The stamp is positioned absolute'));codePanel('CSS excerpt · the stamp rule',['.postcard { position: relative; }','.stamp {','  position: absolute;','  top: 10px;','  right: 12px;','  width: 60px;','}'],beat&&t>=beat.start-item.start?2:0);
 } else if(scene==='anchor_edit'){
  const transition=item.cues.find(c=>c.text.startsWith('Change right'));const changed=transition&&t>=transition.start-item.start;
  codePanel('Schematic · edit the stamp image',['.stamp {','  position: absolute;','  top: 10px;',changed?'  right: 100px;':'  right: 12px;','  width: 60px;','}'],3);
 } else if(scene==='anchor_observe'){
  heading('Actual browser · same width','One picture moves; the others stay');
  box(55,150,520,153,C.white);box(705,150,520,153,C.white);
  crop('wide',760,310,234,65,60,155,510,142);crop('anchor-wide',760,310,234,65,710,155,510,142);
  line(565,155,565,297,C.purple,3);line(1215,155,1215,297,C.purple,3);
  text('BEFORE · right: 12px',55,318,30,C.ink,'bold','DejaVu Sans Mono');text('AFTER · right: 100px',705,318,30,C.ink,'bold','DejaVu Sans Mono');arrow(590,225,685,225);
  crop('wide',30,310,964,245,60,375,510,130);crop('anchor-wide',30,310,964,245,710,375,510,130);
  text('ACTUAL CAPTURES · SAME VIEWPORT',330,518,23,C.purple,'bold','DejaVu Sans');
 } else if(scene==='anchor_resize'){
  heading('Actual browser · same edited rule','The stamp follows its postcard');browser('anchor-wide',70,125,620,395,'WIDE · right: 100px');browser('anchor-phone',915,105,190,412,'PHONE');arrow(720,315,870,315);
 } else if(scene==='inspect'){
  heading('Schematic · two ways to look closer','Source and Inspector answer different questions');box(55,150,535,340,C.white);text('VIEW SOURCE',85,185,33,C.purple,'bold','DejaVu Sans');lines(['Original loaded HTML','Headings, images,','and their markup.'],85,252,34);box(690,150,535,340,C.lav);text('INSPECTOR',720,185,33,C.purple,'bold','DejaVu Sans');lines(['Live document tree','and computed layout.','Find the postcard.'],720,252,34);
 } else if(scene==='exercise'){
  codePanel('Your turn · CSS excerpt: change only right',['.stamp {','  position: absolute;','  right: 40px;','}'],2);
 } else if(scene==='host'){
  heading('Share the files','A static host serves your page');box(55,135,435,350,C.white);lines(['index.html','style.css','snail.svg','garden.svg','stamp.svg'],85,160,32,C.ink,1.7,'DejaVu Sans Mono');arrow(520,300,605,300);box(630,190,250,220,C.lav);lines(['STATIC','HOST'],680,245,36,C.ink,1.4,'DejaVu Sans','bold');arrow(900,300,960,300);browser('phone',1000,110,150,325,'VISITOR');text('site-name.neocities.org',55,510,28,C.purple,'bold','DejaVu Sans Mono');
 } else if(scene==='ending'){
  heading('One page, many screens','The maker chooses the relationships');browser('wide',70,125,620,395,'SAME HTML + CSS');browser('phone',915,105,190,412,'PHONE-WIDTH OUTPUT');arrow(720,315,870,315);
 }
 if(sub)caption(sub);
}
window.prepare=async()=>{data=await(await fetch('/out/timeline.json')).json();for(const n of ['wide','phone','middle','anchor-wide','anchor-phone','gap','w900','w800','w650','w600','w500','snail']){const im=new Image();im.src=n==='snail'?'/example/snail.svg':`/out/${n}.png`;await im.decode();imgs[n]=im}window.ready=true};
window.renderAt=(time)=>{const item=data.find(z=>time>=z.start&&time<z.end)||data.at(-1);const cue=item.cues.find(c=>time>=c.start&&time<c.end);draw(item.scene,time-item.start,cue?cue.text:'',item)};
window.prepare();
</script></body></html>
